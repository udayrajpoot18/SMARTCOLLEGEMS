{% extends 'base.html' %}{% block title %}Delete Teacher{% endblock %}{% block page_title %}Confirm Delete{% endblock %}
{% block content %}<div class="row justify-content-center"><div class="col-md-5"><div class="content-card"><div class="card-body-custom text-center" style="padding:40px;">
<div style="font-size:56px;margin-bottom:16px;">⚠️</div>
<h4 style="font-weight:700;margin-bottom:8px;">Deactivate Teacher?</h4>
<p style="color:var(--text-secondary);margin-bottom:24px;">This will deactivate <strong>{{ teacher.get_full_name }}</strong></p>
<form method="POST">{% csrf_token %}
<button type="submit" class="btn-primary-custom" style="background:var(--gradient-2);">Yes, Deactivate</button>
<a href="{% url 'teacher_list' %}" class="btn-outline-custom ms-2">Cancel</a>
</form></div></div></div></div>{% endblock %}
