{% extends 'base.html' %}{% block title %}Apply Leave{% endblock %}{% block page_title %}Apply for Leave{% endblock %}
{% block content %}<div class="row justify-content-center"><div class="col-lg-6">
<div class="content-card"><div class="card-header-custom"><h5><i class="bi bi-calendar-plus-fill me-2" style="color:#6366f1;"></i>Leave Application</h5><a href="{% url 'leave_list' %}" class="btn-outline-custom" style="padding:6px 14px;"><i class="bi bi-arrow-left"></i> Back</a></div>
<div class="card-body-custom"><form method="POST">{% csrf_token %}
<div class="row g-3">
  <div class="col-12"><label class="form-label">Leave Type *</label>{{ form.leave_type }}</div>
  <div class="col-md-6"><label class="form-label">From Date *</label>{{ form.from_date }}</div>
  <div class="col-md-6"><label class="form-label">To Date *</label>{{ form.to_date }}</div>
  <div class="col-12"><label class="form-label">Reason *</label>{{ form.reason }}</div>
</div>
<div style="margin-top:24px;display:flex;gap:12px;">
  <button type="submit" class="btn-primary-custom"><i class="bi bi-send-fill"></i> Submit Application</button>
  <a href="{% url 'leave_list' %}" class="btn-outline-custom"><i class="bi bi-x-circle"></i> Cancel</a>
</div>
</form></div></div>
</div></div>{% endblock %}
